spring.datasource.url=jdbc:h2:mem:jobtracker;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

jwt.secret=test-jwt-secret-test-jwt-secret-test-jwt-secret-test-jwt-secret
jwt.expiration-ms=86400000
security.encryption-key=test-encryption-key-32bytes-long

# Google OAuth - valores fake para testes (os beans reais são mockados com @MockitoBean)
google.client-id=test-google-client-id
google.client-secret=test-google-client-secret
google.redirect-uri=http://localhost:8080/api/gmail/callback

# URL do frontend usada no GmailController
app.frontend-url=http://localhost:3000
