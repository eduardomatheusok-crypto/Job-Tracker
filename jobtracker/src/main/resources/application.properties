spring.application.name=jobtracker

# Porta do servidor: usa $PORT quando injetado (Render) e 8080 como fallback local
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:REDACTED}
spring.datasource.username=${DB_USERNAME:REDACTED}
spring.datasource.password=${DB_PASSWORD:REDACTED}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

jwt.secret=${JWT_SECRET:REDACTED}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/gmail/callback}
security.encryption-key=${ENCRYPTION_KEY:REDACTED}

app.gmail.sync.enabled=${GMAIL_SYNC_ENABLED:true}
app.gmail.sync.initial-delay-ms=${GMAIL_SYNC_INITIAL_DELAY_MS:60000}
app.gmail.sync.fixed-delay-ms=${GMAIL_SYNC_FIXED_DELAY_MS:3600000}

spring.config.import=optional:file:.env[.properties],optional:file:Job-Tracker/jobtracker/.env[.properties]
