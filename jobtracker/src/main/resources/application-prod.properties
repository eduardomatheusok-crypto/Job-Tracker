# -----------------------------------------------------------------------------
# Profile de produção (ex.: backend no Render, frontend no Vercel)
# Ative com: SPRING_PROFILES_ACTIVE=prod
# -----------------------------------------------------------------------------

# API docs desabilitadas em produção
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# CORS: restringe as origens (ex.: https://meu-app.vercel.app). Separe por vírgula.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Garante que headers de proxy (X-Forwarded-*) sejam respeitados atrás do Render
server.forward-headers-strategy=framework

# Callback OAuth do Gmail em produção (deve apontar para o domínio do backend)
google.redirect-uri=${GOOGLE_REDIRECT_URI:}