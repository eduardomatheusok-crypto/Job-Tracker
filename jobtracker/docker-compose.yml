version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: jobtracker-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobtracker"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobtracker-app
    ports:
      - "8080:8080"
    environment:
      # Banco de dados (aponta para o serviço "db")
      DB_URL: jdbc:postgresql://db:5432/jobtracker
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      
      # Segurança JWT (chave segura de 256 bits para produção)
      JWT_SECRET: super-secure-jwt-secret-key-that-is-at-least-32-bytes-long-for-hmac-sha-256
      JWT_EXPIRATION_MS: 86400000
      
      # Criptografia local de tokens OAuth do Gmail
      ENCRYPTION_KEY: MinhaChaveCriptoDe32BytesDefault!
      
      # Credenciais Google OAuth (substituir por valores válidos no deploy de prod)
      GOOGLE_CLIENT_ID: mock-client-id
      GOOGLE_CLIENT_SECRET: mock-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:8080/api/gmail/callback
      
      # Redirecionamento do frontend pós-callback do Gmail
      APP_FRONTEND_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
