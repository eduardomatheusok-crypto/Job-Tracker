version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: jobtracker-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobtracker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-jobtracker}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobtracker-app
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      # Banco de dados (aponta para o serviço "db")
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-jobtracker}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}

      # Segurança JWT
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (see .env.example)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}

      # Criptografia local de tokens OAuth do Gmail
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set (see .env.example)}

      # Credenciais Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be set (see .env.example)}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET must be set (see .env.example)}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/gmail/callback}

      # Sincronização automática do Gmail
      GMAIL_SYNC_ENABLED: ${GMAIL_SYNC_ENABLED:-true}
      GMAIL_SYNC_INITIAL_DELAY_MS: ${GMAIL_SYNC_INITIAL_DELAY_MS:-60000}
      GMAIL_SYNC_FIXED_DELAY_MS: ${GMAIL_SYNC_FIXED_DELAY_MS:-3600000}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped